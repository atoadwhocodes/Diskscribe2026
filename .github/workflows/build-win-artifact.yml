name: Build Windows Artifact

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions: {}

jobs:
  build-win:
    name: Build Windows Artifact
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/diskscribe-2026-desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix apps/diskscribe-2026-desktop ci

      - name: Validate tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $appVersion = node -p "require('./apps/diskscribe-2026-desktop/package.json').version"
          if ($tagVersion -ne $appVersion) {
            throw "Tag version ($tagVersion) does not match desktop app version ($appVersion)."
          }

      - name: Capture app version
        id: app_version
        shell: pwsh
        run: |
          $appVersion = node -p "require('./apps/diskscribe-2026-desktop/package.json').version"
          "value=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build desktop packages
        run: npm --prefix apps/diskscribe-2026-desktop run make

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $artifactDir = "apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64"
          $checksumFile = Join-Path $artifactDir "SHA256SUMS.txt"
          if (Test-Path $checksumFile) {
            Remove-Item $checksumFile -Force
          }

          Get-ChildItem $artifactDir | Where-Object {
            $_.Name -match "Setup\\.exe$|-full\\.nupkg$|^RELEASES$"
          } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash *$($_.Name)" | Out-File -FilePath $checksumFile -Encoding ascii -Append
          }

          if (-not (Test-Path $checksumFile)) {
            throw "Checksum file was not generated."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DiskScribe2026-Windows-v${{ steps.app_version.outputs.value }}
          path: |
            apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/*Setup.exe
            apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/*-full.nupkg
            apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/RELEASES
            apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $setupExe = (Get-ChildItem "apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/*Setup.exe" | Select-Object -First 1).FullName
          $fullNupkg = (Get-ChildItem "apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/*-full.nupkg" | Select-Object -First 1).FullName
          $releasesFile = "apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/RELEASES"
          $checksumsFile = "apps/diskscribe-2026-desktop/out/make/squirrel.windows/x64/SHA256SUMS.txt"

          gh release view $tag --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "DiskScribe2026 Desktop $tag" `
              --notes "Automated desktop release for $tag." `
              $setupExe `
              $fullNupkg `
              $releasesFile `
              $checksumsFile
          } else {
            gh release upload $tag `
              --repo $env:GITHUB_REPOSITORY `
              --clobber `
              $setupExe `
              $fullNupkg `
              $releasesFile `
              $checksumsFile
          }
