name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/diskscribe-2026-desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix apps/diskscribe-2026-desktop ci

      - name: Audit desktop production dependencies
        run: npm --prefix apps/diskscribe-2026-desktop audit --omit=dev --audit-level=high

      - name: Lint desktop app
        run: npm --prefix apps/diskscribe-2026-desktop run lint

      - name: Test desktop core
        run: npm --prefix apps/diskscribe-2026-desktop run test

      - name: Package desktop app
        run: npm --prefix apps/diskscribe-2026-desktop run package

      - name: Verify package output
        run: |
          test -d apps/diskscribe-2026-desktop/out
          find apps/diskscribe-2026-desktop/out -type f | grep -q .
