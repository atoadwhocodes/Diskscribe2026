name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 5 * * 1"

env:
  CODEQL_ACTION_ANALYSIS_KEY: ".github/workflows/codeql.yml:analyze"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    env:
      CODEQL_ACTION_ANALYSIS_KEY: ".github/workflows/codeql.yml:analyze"
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98
        env:
          CODEQL_ACTION_ANALYSIS_KEY: ".github/workflows/codeql.yml:analyze"
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98
        env:
          CODEQL_ACTION_ANALYSIS_KEY: ".github/workflows/codeql.yml:analyze"
        with:
          upload: ${{ vars.CODEQL_UPLOAD == 'true' }}
      - name: Upload SARIF artifact
        if: ${{ vars.CODEQL_UPLOAD != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: results/*.sarif
          if-no-files-found: error
          retention-days: 14
